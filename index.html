<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>アナウンス照合ツール</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>

<!-- =========================
        Header
========================== -->

<header class="header">

    <div class="header-text">

        <h1>📢 アナウンス照合ツール</h1>

        <p>LINE OpenChat Management Tool</p>

    </div>

    <button id="themeToggle" class="theme-btn">
        🌙
    </button>

</header>

<!-- =========================
        Main
========================== -->

<main class="container">

    <!-- 入力欄 -->
    <section class="input-grid">

        <!-- 元文章 -->

        <div class="card">

            <div class="card-header">

                <h2>📄 元アナウンス</h2>

                <div class="card-buttons">

                    <button id="pasteLeft">
                        📋 貼り付け
                    </button>

                    <button id="clearLeft">
                        🗑️ クリア
                    </button>

                </div>

            </div>

            <textarea
                id="originalText"
                placeholder="元のアナウンスを入力してください..."
            ></textarea>

            <div class="card-footer">

                <span id="leftCount">
                    0文字
                </span>

            </div>

        </div>

        <!-- 比較文章 -->

        <div class="card">

            <div class="card-header">

                <h2>📋 照合するアナウンス</h2>

                <div class="card-buttons">

                    <button id="pasteRight">
                        📋 貼り付け
                    </button>

                    <button id="clearRight">
                        🗑️ クリア
                    </button>

                </div>

            </div>

            <textarea
                id="compareText"
                placeholder="照合するアナウンスを入力してください..."
            ></textarea>

            <div class="card-footer">

                <span id="rightCount">
                    0文字
                </span>

            </div>

        </div>

    </section>

    <!-- ボタン -->

    <section class="action-area">

        <button id="compareBtn" class="compare-btn">

            🔍 照合開始

        </button>

    </section>

    <!-- ローディング -->

    <section id="loading" class="loading hidden">

        <div class="spinner"></div>

        <p>照合しています...</p>

    </section>

    <!-- 結果 -->

    <section class="result-card">

        <div class="result-header">

            <h2>📊 照合結果</h2>

            <button id="copyResult">

                📄 結果をコピー

            </button>

        </div>

        <!-- 一致率 -->

        <div class="score-area">

            <h3>一致率</h3>

            <span id="matchRate">

                0%

            </span>

            <div class="progress">

                <div id="progressBar"></div>

            </div>

        </div>

        <!-- 差分 -->

        <div class="diff-grid">

            <!-- 追加 -->

            <div class="diff-card add">

                <h3>🟢 追加</h3>

                <div id="addedText">

                    ありません

                </div>

            </div>

            <!-- 削除 -->

            <div class="diff-card remove">

                <h3>🔴 削除</h3>

                <div id="removedText">

                    ありません

                </div>

            </div>

            <!-- 変更 -->

            <div class="diff-card change">

                <h3>🟡 変更</h3>

                <div id="changedText">

                    ありません

                </div>

            </div>

        </div>

    </section>

</main>

<!-- =========================
        Toast
========================== -->

<div id="toast" class="toast">

    コピーしました

</div>

<!-- =========================
        Footer
========================== -->

<footer>

    <p>

        © 2026 Kyusai-Eruchi

    </p>

</footer>

<script src="js/script.js"></script>

</body>
</html>
